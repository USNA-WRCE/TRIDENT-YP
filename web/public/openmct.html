<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Telemetry Analysis - OpenMCT</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/openmct@2.2.0/dist/openmct.css">
    <script src="https://cdn.jsdelivr.net/npm/openmct@2.2.0/dist/openmct.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
        }
        #openmct-container {
            width: 100%;
            height: 100%;
        }
        #error-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 12px;
            border-radius: 6px;
            display: none;
            z-index: 9999;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="error-overlay"></div>
    <div id="openmct-container"></div>

    <script>
        window.addEventListener('error', function(e) {
            const errBox = document.getElementById('error-overlay');
            errBox.style.display = 'block';
            errBox.innerText = 'OpenMCT Error: ' + e.message;
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const vehicleId = urlParams.get('vehicle') || 'quadrotorYP';
            const backupUrl = urlParams.get('backup');

            let backupRecords = null;
            if (backupUrl) {
                try {
                    const response = await fetch(backupUrl);
                    if (!response.ok) throw new Error('Could not read the selected flight log backup.');
                    const lines = (await response.text()).split(/\r?\n/).filter(line => line.trim());
                    backupRecords = lines.slice(1).map(line => {
                        const record = JSON.parse(line);
                        return {
                            vehicleId: record.vehicle_id,
                            utc: Date.parse(record.timestamp),
                            fields: record.fields || {},
                            kind: record.kind
                        };
                    }).filter(record => record.vehicleId === vehicleId && Number.isFinite(record.utc)
                        && (record.kind === undefined || record.kind === 'telemetry'));
                    if (backupRecords.length === 0) throw new Error('The backup has no records for this vehicle.');
                } catch (error) {
                    const errBox = document.getElementById('error-overlay');
                    errBox.style.display = 'block';
                    errBox.innerText = 'Flight log error: ' + error.message;
                    return;
                }
            }

            openmct.setAssetPath('https://cdn.jsdelivr.net/npm/openmct@2.2.0/dist');

            // 1. Install Base Plugins and Navigation/Layout Tree Plugins
            openmct.install(openmct.plugins.LocalStorage());
            openmct.install(openmct.plugins.Espresso());
            openmct.install(openmct.plugins.Plot());
            openmct.install(openmct.plugins.TelemetryTable());
            openmct.install(openmct.plugins.MyItems()); // Enables sidebar tree navigation

            // 2. Register UTC Time System
            openmct.install(openmct.plugins.UTCTimeSystem());

            // 3. Initialize Conductor Plugin
            const now = Date.now();
            const fifteenMinutes = 15 * 60 * 1000;
            const requestedStart = Number(urlParams.get('start'));
            const requestedEnd = Number(urlParams.get('end'));
            const initialBounds = urlParams.has('start') && urlParams.has('end')
                && Number.isFinite(requestedStart) && Number.isFinite(requestedEnd)
                && requestedStart < requestedEnd
                ? { start: requestedStart, end: requestedEnd }
                : { start: now - fifteenMinutes, end: now };

            const conductorPlugin = openmct.plugins.Conductor || openmct.plugins.TimeConductor;
            if (typeof conductorPlugin === 'function') {
                openmct.install(conductorPlugin({
                    menuOptions: [
                        {
                            name: "Historical Range",
                            timeSystem: 'utc',
                            mode: 'fixed',
                            bounds: initialBounds
                        },
                        {
                            name: "Realtime",
                            timeSystem: 'utc',
                            mode: 'realtime',
                            bounds: {
                                start: -fifteenMinutes,
                                end: 0
                            }
                        }
                    ]
                }));
            }

            // Set default time system to UTC
            openmct.time.timeSystem('utc', initialBounds);

            // 4. Define Vehicle Taxonomy & Register Under "My Items" (mine)
            const STRING_FIELDS = new Set(['behavior', 'mode']);
            const liveTelemetryFields = [
                { key: 'latitude', name: 'Latitude', unit: 'deg' },
                { key: 'longitude', name: 'Longitude', unit: 'deg' },
                { key: 'altitude', name: 'Altitude', unit: 'm' },
                { key: 'heading', name: 'Heading', unit: 'deg' },
                { key: 'battery_percentage', name: 'Battery Percentage', unit: '' },
                { key: 'battery_voltage', name: 'Battery Voltage', unit: 'V' },
                { key: 'gps_satellites', name: 'GPS Satellites', unit: '' },
                { key: 'gps_fix_type', name: 'GPS Fix Type', unit: '' },
                { key: 'gps_h_acc_m', name: 'GPS Horizontal Accuracy', unit: 'm' },
                { key: 'behavior', name: 'Behavior', unit: '', string: true }
            ];
            const isTelemetryValue = (key, value) => STRING_FIELDS.has(key)
                ? typeof value === 'string'
                : typeof value === 'number' && Number.isFinite(value);
            const backupFieldKeys = backupRecords
                ? [...new Set(backupRecords.flatMap(record => Object.entries(record.fields)
                    .filter(([key, value]) => isTelemetryValue(key, value))
                    .map(([key]) => key)))]
                : [];
            const telemetryFields = backupRecords
                ? backupFieldKeys.map(key => ({ key, name: key.replace(/_/g, ' '), unit: '', string: STRING_FIELDS.has(key) }))
                : liveTelemetryFields;

            const vehicleFolderKey = `vehicle_folder_${vehicleId}`;

            // Add the root folder into the sidebar "My Items" directory
            openmct.objects.addRoot({
                namespace: 'vehicle.taxonomy',
                key: vehicleFolderKey
            }, openmct.priority.HIGH);

            openmct.objects.addProvider('vehicle.taxonomy', {
                get: function (identifier) {
                    if (identifier.key === vehicleFolderKey) {
                        return Promise.resolve({
                            identifier: identifier,
                            name: `Vehicle ${vehicleId}`,
                            type: 'folder',
                            location: 'mine',
                            composition: telemetryFields.map(f => ({
                                namespace: 'vehicle.taxonomy',
                                key: f.key
                            }))
                        });
                    }

                    const field = telemetryFields.find(f => f.key === identifier.key);
                    if (field) {
                        return Promise.resolve({
                            identifier: identifier,
                            name: field.name,
                            type: 'telemetry.telemetryPoint',
                            telemetry: {
                                values: [
                                    field.string
                                        ? { key: 'value', name: 'Value', format: 'string' }
                                        : { key: 'value', name: 'Value', units: field.unit, format: 'float', hints: { range: 1 } },
                                    { key: 'utc', name: 'Timestamp', format: 'utc', hints: { domain: 1 } }
                                ]
                            },
                            location: `vehicle.taxonomy:${vehicleFolderKey}`
                        });
                    }

                    return Promise.reject(new Error('Object not found'));
                }
            });

            // 5. Historical Telemetry Provider (FastAPI -> InfluxDB)
            openmct.telemetry.addProvider({
                supportsRequest: function (domainObject) {
                    return domainObject.type === 'telemetry.telemetryPoint';
                },
                request: function (domainObject, options) {
                    const field = domainObject.identifier.key;
                    if (backupRecords) {
                        return Promise.resolve(backupRecords
                            .filter(record => record.utc >= options.start && record.utc < options.end
                                && isTelemetryValue(field, record.fields[field]))
                            .map(record => ({ utc: record.utc, value: record.fields[field] })));
                    }
                    const url = `/api/openmct/history/${encodeURIComponent(vehicleId)}/yp_messages/${field}?start=${options.start}&end=${options.end}`;
                    
                    return fetch(url)
                        .then(res => res.ok ? res.json() : [])
                        .then(data => data.map(pt => ({ utc: pt.timestamp, value: pt.value })))
                        .catch(() => []);
                }
            });

            // 6. Realtime Telemetry Provider (WebSocket)
            openmct.telemetry.addProvider({
                supportsSubscribe: function (domainObject) {
                    return !backupRecords && domainObject.type === 'telemetry.telemetryPoint';
                },
                subscribe: function (domainObject, callback) {
                    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/ship_state`);
                    
                    ws.onmessage = function (event) {
                        try {
                            const data = JSON.parse(event.data);
                            if (data.op === 'vehicle_update' && data.vehicle && data.vehicle.vehicle_id === vehicleId) {
                                const fieldKey = domainObject.identifier.key;
                                const v = data.vehicle;
                                const gps = v.gps_fix || {};
                                const liveValues = {
                                    latitude: v.position && v.position.latitude,
                                    longitude: v.position && v.position.longitude,
                                    altitude: v.position && v.position.altitude,
                                    heading: v.heading,
                                    behavior: v.behavior,
                                    battery_percentage: v.battery && v.battery.percentage,
                                    battery_voltage: v.battery && v.battery.voltage,
                                    gps_satellites: gps.satellites_visible,
                                    gps_fix_type: gps.fix_type,
                                    gps_h_acc_m: gps.horizontal_accuracy_m
                                };
                                const val = liveValues[fieldKey];

                                if (val !== null && val !== undefined && isTelemetryValue(fieldKey, val)) {
                                    callback({
                                        utc: Date.now(),
                                        value: val
                                    });
                                }
                            }
                        } catch (e) {
                            console.error("WS Parse Error", e);
                        }
                    };

                    return function unsubscribe() {
                        ws.close();
                    };
                }
            });

            // Mount OpenMCT UI to container
            openmct.start(document.getElementById('openmct-container'));
        });
    </script>
</body>
</html>
